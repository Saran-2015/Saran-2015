{% extends 'base.html' %}

{% block content %}
    <h1 class="text-center">Edit Product Movement</h1>

    <div class="card">
        <div class="card-header">
            <h2>Edit Movement Details</h2>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="from_location" class="form-label">From Location:</label>
                    <input type="text" class="form-control" name="from_location" value="{{ movement[2] }}" required>
                </div>
                <div class="mb-3">
                    <label for="to_location" class="form-label">To Location:</label>
                    <input type="text" class="form-control" name="to_location" value="{{ movement[3] }}">
                </div>
                <div class="mb-3">
                    <label for="qty" class="form-label">Quantity:</label>
                    <input type="number" class="form-control" name="qty" value="{{ movement[5] }}" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Movement</button>
                <a href="{{ url_for('product_movements') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
