{% extends 'base.html' %}

{% block content %}
    <h1 class="text-center">Add Product Movement</h1>

    <div class="card">
        <div class="card-header">
            <h2>Add New Movement</h2>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="product_id" class="form-label">Product:</label>
                    <select class="form-select" name="product_id" required>
                        {% for product in products %}
                            <option value="{{ product[0] }}">{{ product[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="from_location" class="form-label">From Location:</label>
                    <input type="text" class="form-control" name="from_location" required>
                </div>
                <div class="mb-3">
                    <label for="to_location" class="form-label">To Location:</label>
                    <input type="text" class="form-control" name="to_location">
                </div>
                <div class="mb-3">
                    <label for="qty" class="form-label">Quantity:</label>
                    <input type="number" class="form-control" name="qty" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Movement</button>
                <a href="{{ url_for('product_movements') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
