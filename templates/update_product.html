
{% extends 'base.html' %}

{% block content %}
    <h1 class="text-center">Update Product</h1>

    <div class="card">
        <div class="card-header">
            <h2>Update Product Details</h2>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="product_name" class="form-label">Product Name:</label>
                    <input type="text" id="product_name" name="product_name" class="form-control" value="{{ product[1] }}" required>
                </div>
                <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" class="form-control" value="{{ product[2] }}" required>
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">Price (₹):</label>
                    <input type="number" id="price" name="price" class="form-control" step="0.01" value="{{ product[3] }}" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Product</button>
            </form>
        </div>
    </div>

    <div class="mt-4">
        <a href="{{ url_for('product') }}" class="btn btn-secondary">Back</a>
    </div>
{% endblock %}
